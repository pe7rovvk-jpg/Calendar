<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Календарь</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-main: #f4f6fa;
    --card-bg: rgba(255, 255, 255, 0.95);
    --card-border: #e2e8f0;
    --text-main: #0f172a;
    --text-muted: #64748b;
    
    --user-a-grad: linear-gradient(135deg, #4f46e5, #6366f1);
    --user-b-grad: linear-gradient(135deg, #e11d48, #f43f5e);
    
    --cat-work: #0284c7;
    --cat-meet: #7c3aed;
    --cat-rest: #10b981;
    --cat-imp:  #f43f5e;
    
    --radius-lg: 20px;
    --radius-md: 10px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg-main);
    color: var(--text-main);
    min-height: 100vh;
    padding: 12px 10px 40px;
    -webkit-font-smoothing: antialiased;
  }

  header, .container { max-width: 500px; margin: 0 auto; }

  /* Шапка */
  header {
    padding: 10px 4px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(139, 92, 246, 0.3);
  }

  .logo-icon svg {
    width: 22px; height: 22px; fill: #ffffff;
  }

  .logo-text h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; color: #0f172a; }
  .logo-text p { font-size: 11px; color: var(--text-muted); font-weight: 600; }

  .user-pill {
    background: #ffffff;
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 6px 12px;
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700;
    box-shadow: 0 2px 6px rgba(0,0,0,0.03);
  }

  .container {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .glass-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    padding: 14px;
    box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
  }

  /* Stats Bar */
  .stats-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
  }

  .stat-val { font-size: 18px; font-weight: 800; color: #0f172a; }
  .stat-lbl { font-size: 11px; color: var(--text-muted); font-weight: 600; }

  .progress-wrap { width: 130px; }
  .progress-bar-bg {
    height: 6px; background: #e2e8f0;
    border-radius: 10px; overflow: hidden; margin-top: 4px;
  }
  .progress-bar-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #6366f1, #ec4899);
    border-radius: 10px; transition: width 0.4s ease;
  }

  /* Calendar Header */
  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .cal-title { font-size: 17px; font-weight: 800; text-transform: capitalize; color: #0f172a; }

  .nav-btns { display: flex; gap: 6px; }

  .btn-icon {
    height: 30px; padding: 0 10px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    background: #ffffff;
    color: var(--text-main);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 12px; font-weight: 700;
  }

  /* Сетка строго равной ширины */
  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    text-align: center;
    font-size: 11px;
    font-weight: 800;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .days-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 4px;
    width: 100%;
  }

  .day-cell {
    min-height: 62px;
    min-width: 0;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: var(--radius-md);
    padding: 4px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }

  .day-cell.other { opacity: 0.3; background: #f8fafc; }
  
  .day-cell.today {
    border-color: #6366f1;
    background: #f5f3ff;
  }

  .day-cell.selected {
    border: 2px solid #8b5cf6;
    box-shadow: 0 0 8px rgba(139, 92, 246, 0.3);
  }

  .day-num {
    font-size: 11px; font-weight: 800;
    width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px; color: #334155;
  }

  .day-cell.today .day-num { background: #6366f1; color: #fff; }

  .event-dots { display: flex; flex-direction: column; gap: 2px; width: 100%; min-width: 0; }

  .time-chip {
    font-size: 9px; font-weight: 800;
    padding: 2px 0; border-radius: 4px;
    color: #fff; text-align: center;
    width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .time-chip.author-A { background: var(--user-a-grad); }
  .time-chip.author-B { background: var(--user-b-grad); }

  /* Панель деталей */
  .sidebar-header {
    border-bottom: 1px solid #e2e8f0;
    padding-bottom: 8px; margin-bottom: 10px;
  }

  .sidebar-header h3 { font-size: 15px; font-weight: 800; color: #0f172a; }
  .sidebar-header p { font-size: 11px; color: var(--text-muted); }

  .event-list {
    display: flex; flex-direction: column; gap: 8px;
    max-height: 220px; overflow-y: auto; margin-bottom: 12px;
  }

  .event-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: var(--radius-md);
    padding: 10px; position: relative; overflow: hidden;
  }

  .event-card::before {
    content: ''; position: absolute;
    left: 0; top: 0; bottom: 0; width: 4px;
  }

  .event-card.author-A::before { background: var(--user-a-grad); }
  .event-card.author-B::before { background: var(--user-b-grad); }

  .event-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .badge-cat { font-size: 8.5px; font-weight: 800; text-transform: uppercase; padding: 2px 6px; border-radius: 6px; color: #fff; }
  .time-badge { font-size: 11px; font-weight: 800; color: #4338ca; background: #e0e7ff; padding: 1px 6px; border-radius: 4px; }
  .event-title { font-size: 13px; font-weight: 800; color: #0f172a; margin-top: 2px; }
  .event-note { font-size: 11px; color: var(--text-muted); margin-top: 4px; background: #f8fafc; padding: 6px; border-radius: 6px; word-break: break-word; }

  .event-footer {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 8px; padding-top: 6px; border-top: 1px solid #f1f5f9;
  }

  .author-tag { font-size: 10px; font-weight: 700; color: #475569; }
  
  .actions { display: flex; gap: 8px; }
  .actions button { background: none; border: none; font-size: 10.5px; font-weight: 700; cursor: pointer; }
  .btn-edit { color: #4f46e5; }
  .btn-del { color: #ef4444; }

  /* Форма */
  .add-box { border-top: 1px solid #e2e8f0; padding-top: 10px; }
  .form-group { margin-bottom: 8px; }
  .form-group label { display: block; font-size: 10px; font-weight: 800; color: var(--text-muted); margin-bottom: 3px; text-transform: uppercase; }

  .form-control {
    width: 100%; background: #ffffff;
    border: 1px solid #cbd5e1; border-radius: var(--radius-sm);
    padding: 7px 10px; color: var(--text-main); font-family: inherit; font-size: 12px; outline: none;
  }

  .cat-selector { display: flex; gap: 4px; margin-top: 2px; }

  .cat-opt {
    flex: 1; text-align: center; padding: 4px;
    font-size: 9.5px; font-weight: 800; border-radius: 6px;
    cursor: pointer; color: #fff; opacity: 0.6; transition: opacity 0.2s;
  }

  .cat-opt.active { opacity: 1; }

  .form-btns { display: flex; gap: 6px; margin-top: 6px; }

  .btn-submit {
    flex: 1; background: linear-gradient(135deg, #6366f1, #a855f7);
    border: none; border-radius: var(--radius-sm);
    padding: 9px; color: #fff; font-weight: 800; font-size: 12px;
    cursor: pointer;
  }

  .btn-cancel {
    background: #e2e8f0; color: #475569;
    border: none; border-radius: var(--radius-sm);
    padding: 9px 12px; font-weight: 800; font-size: 12px;
    cursor: pointer; display: none;
  }

  .empty-state { text-align: center; padding: 16px 10px; color: var(--text-muted); font-size: 12px; }
</style>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<header>
  <div class="logo-group">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24">
        <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zM7 12h5v5H7z"/>
      </svg>
    </div>
    <div class="logo-text">
      <h1>Общий Календарь</h1>
      <p>Настя & Ира</p>
    </div>
  </div>

  <div class="user-pill">
    <span>👤</span>
    <select id="whoSelect" style="background:none; border:none; color:inherit; font-weight:800; cursor:pointer; outline:none;">
      <option value="A" style="color:#000">Настя</option>
      <option value="B" style="color:#000">Ира</option>
    </select>
  </div>
</header>

<div class="container">

  <!-- Stats Bar -->
  <div class="glass-card stats-bar">
    <div>
      <div class="stat-val" id="totalMonthEvs">0</div>
      <div class="stat-lbl">Записей в этом месяце</div>
    </div>
    <div class="progress-wrap">
      <div class="stat-lbl" style="display:flex; justify-content:space-between;">
        <span>Загрузка</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>
  </div>

  <!-- Calendar Section -->
  <div class="glass-card">
    <div class="cal-header">
      <div class="cal-title" id="monthLabel">—</div>
      <div class="nav-btns">
        <button class="btn-icon" id="prevBtn">‹</button>
        <button class="btn-icon" id="todayBtn">Сегодня</button>
        <button class="btn-icon" id="nextBtn">›</button>
      </div>
    </div>

    <div class="weekdays">
      <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
    </div>

    <div class="days-grid" id="calGrid"></div>
  </div>

  <!-- Sidebar Details Section -->
  <div class="glass-card">
    <div class="sidebar-header">
      <h3 id="selDateLabel">Выберите день</h3>
      <p id="selDateSub">Нажмите на ячейку в календаре</p>
    </div>

    <div class="event-list" id="eventList">
      <div class="empty-state">Нажмите на день, чтобы посмотреть или добавить запись</div>
    </div>

    <div class="add-box" id="addForm" style="display:none;">
      <div class="form-group">
        <label>Категория</label>
        <div class="cat-selector">
          <div class="cat-opt active" data-cat="work" style="background:var(--cat-work)">Работа</div>
          <div class="cat-opt" data-cat="meet" style="background:var(--cat-meet)">Встреча</div>
          <div class="cat-opt" data-cat="rest" style="background:var(--cat-rest)">Отдых</div>
          <div class="cat-opt" data-cat="imp" style="background:var(--cat-imp)">Важно</div>
        </div>
      </div>

      <div class="form-group">
        <label>Время</label>
        <input type="text" class="form-control" id="evTime" placeholder="Например: 15:00">
      </div>

      <div class="form-group">
        <label>Куда / Что запланировано</label>
        <input type="text" class="form-control" id="evTitle" placeholder="Например: Кремень / Встреча">
      </div>

      <div class="form-group">
        <label>Пометки и заметки</label>
        <textarea class="form-control" id="evNote" rows="2" placeholder="Дополнительная информация..."></textarea>
      </div>

      <div class="form-btns">
        <button class="btn-submit" id="addBtn">Добавить запись</button>
        <button class="btn-cancel" id="cancelBtn">Отмена</button>
      </div>
    </div>
  </div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDFhYdhoxk3dT8ylTmFRa4_3f0FreoNxrU",
  authDomain: "calendar-71517.firebaseapp.com",
  databaseURL: "https://calendar-71517-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "calendar-71517",
  storageBucket: "calendar-71517.firebasestorage.app",
  messagingSenderId: "374541828108",
  appId: "1:374541828108:web:96a470cc33bfa7ebe96e29",
  measurementId: "G-81EQ7N0J5V"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const CATS = {
  work: { label: 'Работа', color: 'var(--cat-work)' },
  meet: { label: 'Встреча', color: 'var(--cat-meet)' },
  rest: { label: 'Отдых', color: 'var(--cat-rest)' },
  imp:  { label: 'Важно', color: 'var(--cat-imp)' }
};

let events = {};
let viewDate = new Date();
let selectedDate = null;
let currentUser = localStorage.getItem('calUser') || 'A';
let selectedCategory = 'work';
let editingEventId = null; // ID редактируемой записи

document.querySelectorAll('.cat-opt').forEach(opt => {
  opt.addEventListener('click', () => {
    document.querySelectorAll('.cat-opt').forEach(o => o.classList.remove('active'));
    opt.classList.add('active');
    selectedCategory = opt.dataset.cat;
  });
});

function setCategorySelect(catKey) {
  selectedCategory = catKey || 'work';
  document.querySelectorAll('.cat-opt').forEach(o => {
    if(o.dataset.cat === selectedCategory) o.classList.add('active');
    else o.classList.remove('active');
  });
}

const whoSelect = document.getElementById('whoSelect');
whoSelect.value = currentUser;
whoSelect.addEventListener('change', () => {
  currentUser = whoSelect.value;
  localStorage.setItem('calUser', currentUser);
});

function pad(n){ return n < 10 ? '0'+n : ''+n; }
function dateKey(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }

db.ref('events').on('value', (snapshot) => {
  const data = snapshot.val();
  events = {};
  if (data) {
    Object.keys(data).forEach(key => {
      events[key] = Object.keys(data[key]).map(id => ({ id, ...data[key][id] }));
    });
  }
  renderCalendar();
  if(selectedDate) renderSidebar();
});

function renderCalendar(){
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  document.getElementById('monthLabel').textContent = MONTHS[month] + ' ' + year;

  const first = new Date(year, month, 1);
  let startOffset = first.getDay() - 1;
  if(startOffset < 0) startOffset = 6;

  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();

  const cells = [];
  for(let i=startOffset; i>0; i--){
    cells.push({ day: daysInPrevMonth - i + 1, other: true, date: new Date(year, month-1, daysInPrevMonth - i + 1) });
  }
  for(let d=1; d<=daysInMonth; d++){
    cells.push({ day: d, other: false, date: new Date(year, month, d) });
  }
  while(cells.length % 7 !== 0 || cells.length < 35){
    const idx = cells.length - (startOffset + daysInMonth) + 1;
    cells.push({ day: idx, other: true, date: new Date(year, month+1, idx) });
  }

  const today = new Date();
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  let monthEventCount = 0;

  cells.forEach(cell => {
    const key = dateKey(cell.date);
    const dayEvents = events[key] || [];
    if(!cell.other) monthEventCount += dayEvents.length;

    const div = document.createElement('div');
    div.className = 'day-cell' + (cell.other ? ' other' : '') + (sameDay(cell.date, today) ? ' today' : '') + (selectedDate && sameDay(cell.date, selectedDate) ? ' selected' : '');

    const num = document.createElement('div');
    num.className = 'day-num';
    num.textContent = cell.day;
    div.appendChild(num);

    const dots = document.createElement('div');
    dots.className = 'event-dots';

    dayEvents.slice(0, 2).forEach(ev => {
      const chip = document.createElement('div');
      chip.className = `time-chip author-${ev.author}`;
      chip.textContent = ev.time ? ev.time : 'Запись';
      dots.appendChild(chip);
    });

    if(dayEvents.length > 2) {
      const more = document.createElement('div');
      more.style.fontSize = '8px';
      more.style.fontWeight = '800';
      more.style.textAlign = 'center';
      more.style.color = 'var(--text-muted)';
      more.textContent = `+${dayEvents.length - 2}`;
      dots.appendChild(more);
    }

    div.appendChild(dots);

    div.addEventListener('click', () => {
      selectedDate = cell.date;
      cancelEdit();
      renderCalendar();
      renderSidebar();
    });

    grid.appendChild(div);
  });

  document.getElementById('totalMonthEvs').textContent = monthEventCount;
  const pct = Math.min(Math.round((monthEventCount / 30) * 100), 100);
  document.getElementById('progressPct').textContent = `${pct}%`;
  document.getElementById('progressFill').style.width = `${pct}%`;
}

function renderSidebar(){
  const key = dateKey(selectedDate);
  const dayEvents = events[key] || [];
  const weekdayNames = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];

  document.getElementById('selDateLabel').textContent = selectedDate.getDate() + ' ' + MONTHS[selectedDate.getMonth()];
  document.getElementById('selDateSub').textContent = weekdayNames[selectedDate.getDay()] + ', ' + selectedDate.getFullYear();
  document.getElementById('addForm').style.display = 'block';

  const list = document.getElementById('eventList');
  list.innerHTML = '';

  if(dayEvents.length === 0){
    list.innerHTML = '<div class="empty-state">Нет записей на этот день ☕️</div>';
  } else {
    dayEvents.sort((a,b) => (a.time||'').localeCompare(b.time||''));
    dayEvents.forEach(ev => {
      const card = document.createElement('div');
      card.className = `event-card author-${ev.author}`;

      const catInfo = CATS[ev.category || 'work'];

      // Безопасное экранирование спецсимволов для вызова JS
      const safeEv = JSON.stringify(ev).replace(/'/g, "&apos;").replace(/"/g, "&quot;");

      card.innerHTML = `
        <div class="event-meta">
          <span class="badge-cat" style="background:${catInfo.color}">${catInfo.label}</span>
          <span class="time-badge">${ev.time || 'Весь день'}</span>
        </div>
        <div class="event-title">${ev.title}</div>
        ${ev.note ? `<div class="event-note">📌 ${ev.note}</div>` : ''}
        <div class="event-footer">
          <div class="author-tag">
            Добавил(а): <b>${ev.author === 'B' ? 'Ира' : 'Настя'}</b>
          </div>
          <div class="actions">
            <button class="btn-edit" onclick="startEdit('${key}', '${ev.id}')">Редактировать</button>
            <button class="btn-del" onclick="deleteEvent('${key}', '${ev.id}')">Удалить</button>
          </div>
        </div>
      `;
      list.appendChild(card);
    });
  }

  if(!editingEventId) {
    resetForm();
  }
}

function startEdit(key, id) {
  const dayEvents = events[key] || [];
  const ev = dayEvents.find(e => e.id === id);
  if(!ev) return;

  editingEventId = id;
  document.getElementById('evTitle').value = ev.title || '';
  document.getElementById('evTime').value = ev.time || '';
  document.getElementById('evNote').value = ev.note || '';
  setCategorySelect(ev.category || 'work');

  document.getElementById('addBtn').textContent = 'Сохранить изменения';
  document.getElementById('cancelBtn').style.display = 'block';
  document.getElementById('evTitle').focus();
}

function cancelEdit() {
  editingEventId = null;
  resetForm();
  document.getElementById('addBtn').textContent = 'Добавить запись';
  document.getElementById('cancelBtn').style.display = 'none';
}

function resetForm() {
  document.getElementById('evTitle').value = '';
  document.getElementById('evTime').value = '';
  document.getElementById('evNote').value = '';
}

function saveEvent(key){
  const title = document.getElementById('evTitle').value.trim();
  if(!title){ alert('Заполните поле "Куда / Что запланировано"!'); return; }

  const payload = {
    title: title,
    time: document.getElementById('evTime').value.trim(),
    note: document.getElementById('evNote').value.trim(),
    category: selectedCategory,
    author: currentUser
  };

  if (editingEventId) {
    // Редактирование имеющейся записи
    db.ref('events/' + key + '/' + editingEventId).update(payload)
      .then(() => cancelEdit());
  } else {
    // Создание новой записи
    db.ref('events/' + key).push(payload)
      .then(() => resetForm());
  }
}

function deleteEvent(key, id){
  if(confirm('Удалить эту запись?')) {
    db.ref('events/' + key + '/' + id).remove();
    if(editingEventId === id) cancelEdit();
  }
}

document.getElementById('addBtn').onclick = () => {
  if(selectedDate) saveEvent(dateKey(selectedDate));
};

document.getElementById('cancelBtn').onclick = () => cancelEdit();

document.getElementById('prevBtn').addEventListener('click', () => {
  viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()-1, 1);
  renderCalendar();
});
document.getElementById('nextBtn').addEventListener('click', () => {
  viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 1);
  renderCalendar();
});
document.getElementById('todayBtn').addEventListener('click', () => {
  viewDate = new Date();
  renderCalendar();
});
</script>

</body>
</html>
