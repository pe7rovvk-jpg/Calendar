<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Календарь</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-main: #f8fafc;
    --card-bg: rgba(255, 255, 255, 0.9);
    --card-border: rgba(226, 232, 240, 0.8);
    --text-main: #0f172a;
    --text-muted: #64748b;
    
    --user-a-grad: linear-gradient(135deg, #6366f1, #4f46e5);
    --user-b-grad: linear-gradient(135deg, #ec4899, #f43f5e);
    
    --cat-work: #0284c7;
    --cat-meet: #7c3aed;
    --cat-rest: #10b981;
    --cat-imp:  #f43f5e;
    
    --radius-lg: 20px;
    --radius-md: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg-main);
    color: var(--text-main);
    min-height: 100vh;
    padding: 12px 10px 40px;
    position: relative;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Размытые мягкие фигуры на фоне */
  .bg-shape {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    z-index: 0;
    pointer-events: none;
    opacity: 0.5;
  }
  .bg-shape-1 {
    width: 280px; height: 280px;
    background: #c7d2fe;
    top: -50px; left: -50px;
  }
  .bg-shape-2 {
    width: 300px; height: 300px;
    background: #fbcfe8;
    bottom: -50px; right: -50px;
  }

  header, .container { position: relative; z-index: 1; max-width: 600px; margin: 0 auto; }

  /* Шапка */
  header {
    padding: 8px 4px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* Трендовый иконка-значок (SVG Sparkle Gradient) */
  .logo-icon {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px rgba(99, 102, 241, 0.3);
  }

  .logo-icon svg {
    width: 22px; height: 22px; fill: none; stroke: #ffffff;
    stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
  }

  .logo-text h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.4px; color: #0f172a; }
  .logo-text p { font-size: 11px; color: var(--text-muted); font-weight: 600; }

  .user-pill {
    background: #ffffff;
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 6px 12px;
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700;
    box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  }

  .container {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Glass Card */
  .glass-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: var(--radius-lg);
    padding: 16px;
    box-shadow: 0 6px 20px rgba(15, 23, 42, 0.03);
  }

  /* Stats Bar */
  .stats-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
  }

  .stat-val { font-size: 18px; font-weight: 800; color: #0f172a; }
  .stat-lbl { font-size: 11px; color: var(--text-muted); font-weight: 600; }

  .progress-wrap { width: 140px; }
  .progress-bar-bg {
    height: 6px; background: #e2e8f0;
    border-radius: 10px; overflow: hidden; margin-top: 4px;
  }
  .progress-bar-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #6366f1, #ec4899);
    border-radius: 10px; transition: width 0.4s ease;
  }

  /* Calendar Header */
  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .cal-title { font-size: 18px; font-weight: 800; text-transform: capitalize; color: #0f172a; }

  .nav-btns { display: flex; gap: 6px; }

  .btn-icon {
    height: 32px; padding: 0 10px;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
    background: #ffffff;
    color: var(--text-main);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 13px; font-weight: 700;
  }

  /* Grid */
  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 10px;
    font-weight: 800;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .day-cell {
    min-height: 68px;
    background: #ffffff;
    border: 1px solid #edf2f7;
    border-radius: var(--radius-md);
    padding: 5px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: all 0.15s ease;
  }

  .day-cell.other { opacity: 0.3; background: #f8fafc; }
  
  .day-cell.today {
    border-color: #6366f1;
    background: #f5f3ff;
  }

  .day-cell.selected {
    border: 2px solid #8b5cf6;
    box-shadow: 0 0 10px rgba(139, 92, 246, 0.2);
  }

  .day-num {
    font-size: 12px; font-weight: 800;
    width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 5px; color: #334155;
  }

  .day-cell.today .day-num { background: #6366f1; color: #fff; }

  .event-dots { display: flex; flex-direction: column; gap: 2px; }

  .mini-chip {
    font-size: 9px; font-weight: 700;
    padding: 2px 4px; border-radius: 4px;
    color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .mini-chip.author-A { background: var(--user-a-grad); }
  .mini-chip.author-B { background: var(--user-b-grad); }

  /* Sidebar Details */
  .sidebar-header {
    border-bottom: 1px solid #e2e8f0;
    padding-bottom: 10px; margin-bottom: 10px;
  }

  .sidebar-header h3 { font-size: 15px; font-weight: 800; color: #0f172a; }
  .sidebar-header p { font-size: 11px; color: var(--text-muted); }

  .event-list {
    display: flex; flex-direction: column; gap: 8px;
    max-height: 220px; overflow-y: auto; margin-bottom: 12px;
  }

  .event-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: var(--radius-md);
    padding: 10px; position: relative; overflow: hidden;
  }

  .event-card::before {
    content: ''; position: absolute;
    left: 0; top: 0; bottom: 0; width: 3px;
  }

  .event-card.author-A::before { background: var(--user-a-grad); }
  .event-card.author-B::before { background: var(--user-b-grad); }

  .event-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .badge-cat { font-size: 8.5px; font-weight: 800; text-transform: uppercase; padding: 2px 6px; border-radius: 6px; color: #fff; }
  .time-badge { font-size: 10px; font-weight: 700; color: var(--text-muted); }
  .event-title { font-size: 12.5px; font-weight: 700; color: #0f172a; }
  .event-note { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .event-footer {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 6px; padding-top: 4px; border-top: 1px solid #f1f5f9;
  }

  .author-tag { font-size: 10px; font-weight: 700; color: #334155; }
  .actions button { background: none; border: none; font-size: 10px; font-weight: 700; color: #ef4444; cursor: pointer; }

  /* Form */
  .add-box { border-top: 1px solid #e2e8f0; padding-top: 10px; }
  .form-group { margin-bottom: 8px; }
  .form-group label { display: block; font-size: 10px; font-weight: 800; color: var(--text-muted); margin-bottom: 3px; text-transform: uppercase; }

  .form-control {
    width: 100%; background: #ffffff;
    border: 1px solid #cbd5e1; border-radius: var(--radius-sm);
    padding: 7px 10px; color: var(--text-main); font-family: inherit; font-size: 12px; outline: none;
  }

  .cat-selector { display: flex; gap: 4px; margin-top: 2px; }

  .cat-opt {
    flex: 1; text-align: center; padding: 4px;
    font-size: 9.5px; font-weight: 800; border-radius: 6px;
    cursor: pointer; color: #fff; opacity: 0.6; transition: opacity 0.2s;
  }

  .cat-opt.active { opacity: 1; }

  .btn-submit {
    width: 100%; background: linear-gradient(135deg, #6366f1, #a855f7);
    border: none; border-radius: var(--radius-sm);
    padding: 9px; color: #fff; font-weight: 800; font-size: 12px;
    cursor: pointer; margin-top: 6px;
  }

  .empty-state { text-align: center; padding: 16px 10px; color: var(--text-muted); font-size: 12px; }
</style>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="bg-shape bg-shape-1"></div>
<div class="bg-shape bg-shape-2"></div>

<header>
  <div class="logo-group">
    <!-- Трендовая стильная SVG иконка -->
    <div class="logo-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" />
      </svg>
    </div>
    <div class="logo-text">
      <h1>Календарь</h1>
      <p>Настя & Ира</p>
    </div>
  </div>

  <div class="user-pill">
    <span>👤</span>
    <select id="whoSelect" style="background:none; border:none; color:inherit; font-weight:800; cursor:pointer; outline:none;">
      <option value="A" style="color:#000">Настя</option>
      <option value="B" style="color:#000">Ира</option>
    </select>
  </div>
</header>

<div class="container">

  <!-- Stats Bar -->
  <div class="glass-card stats-bar">
    <div>
      <div class="stat-val" id="totalMonthEvs">0</div>
      <div class="stat-lbl">Записей в этом месяце</div>
    </div>
    <div class="progress-wrap">
      <div class="stat-lbl" style="display:flex; justify-content:space-between;">
        <span>Загрузка</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>
  </div>

  <!-- Calendar Section -->
  <div class="glass-card">
    <div class="cal-header">
      <div class="cal-title" id="monthLabel">—</div>
      <div class="nav-btns">
        <button class="btn-icon" id="prevBtn">‹</button>
        <button class="btn-icon" id="todayBtn">Сегодня</button>
        <button class="btn-icon" id="nextBtn">›</button>
      </div>
    </div>

    <div class="weekdays">
      <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
    </div>

    <div class="days-grid" id="calGrid"></div>
  </div>

  <!-- Sidebar Section -->
  <div class="glass-card">
    <div class="sidebar-header">
      <h3 id="selDateLabel">Выберите день</h3>
      <p id="selDateSub">Нажмите на дату в сетке</p>
    </div>

    <div class="event-list" id="eventList">
      <div class="empty-state">Выберите день для просмотра планов</div>
    </div>

    <div class="add-box" id="addForm" style="display:none;">
      <div class="form-group">
        <label>Категория</label>
        <div class="cat-selector">
          <div class="cat-opt active" data-cat="work" style="background:var(--cat-work)">Работа</div>
          <div class="cat-opt" data-cat="meet" style="background:var(--cat-meet)">Встреча</div>
          <div class="cat-opt" data-cat="rest" style="background:var(--cat-rest)">Отдых</div>
          <div class="cat-opt" data-cat="imp" style="background:var(--cat-imp)">Важно</div>
        </div>
      </div>

      <div class="form-group">
        <label>Время</label>
        <input type="text" class="form-control" id="evTime" placeholder="14:00">
      </div>

      <div class="form-group">
        <label>Запланировано</label>
        <input type="text" class="form-control" id="evTitle" placeholder="Событие">
      </div>

      <div class="form-group">
        <label>Заметка</label>
        <textarea class="form-control" id="evNote" rows="2" placeholder="Детали..."></textarea>
      </div>

      <button class="btn-submit" id="addBtn">Добавить</button>
    </div>
  </div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDFhYdhoxk3dT8ylTmFRa4_3f0FreoNxrU",
  authDomain: "calendar-71517.firebaseapp.com",
  databaseURL: "https://calendar-71517-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "calendar-71517",
  storageBucket: "calendar-71517.firebasestorage.app",
  messagingSenderId: "374541828108",
  appId: "1:374541828108:web:96a470cc33bfa7ebe96e29",
  measurementId: "G-81EQ7N0J5V"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const CATS = {
  work: { label: 'Работа', color: 'var(--cat-work)' },
  meet: { label: 'Встреча', color: 'var(--cat-meet)' },
  rest: { label: 'Отдых', color: 'var(--cat-rest)' },
  imp:  { label: 'Важно', color: 'var(--cat-imp)' }
};

let events = {};
let viewDate = new Date();
let selectedDate = null;
let currentUser = localStorage.getItem('calUser') || 'A';
let selectedCategory = 'work';

document.querySelectorAll('.cat-opt').forEach(opt => {
  opt.addEventListener('click', () => {
    document.querySelectorAll('.cat-opt').forEach(o => o.classList.remove('active'));
    opt.classList.add('active');
    selectedCategory = opt.dataset.cat;
  });
});

const whoSelect = document.getElementById('whoSelect');
whoSelect.value = currentUser;
whoSelect.addEventListener('change', () => {
  currentUser = whoSelect.value;
  localStorage.setItem('calUser', currentUser);
});

function pad(n){ return n < 10 ? '0'+n : ''+n; }
function dateKey(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }

db.ref('events').on('value', (snapshot) => {
  const data = snapshot.val();
  events = {};
  if (data) {
    Object.keys(data).forEach(key => {
      events[key] = Object.keys(data[key]).map(id => ({ id, ...data[key][id] }));
    });
  }
  renderCalendar();
  if(selectedDate) renderSidebar();
});

function renderCalendar(){
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  document.getElementById('monthLabel').textContent = MONTHS[month] + ' ' + year;

  const first = new Date(year, month, 1);
  let startOffset = first.getDay() - 1;
  if(startOffset < 0) startOffset = 6;

  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();

  const cells = [];
  for(let i=startOffset; i>0; i--){
    cells.push({ day: daysInPrevMonth - i + 1, other: true, date: new Date(year, month-1, daysInPrevMonth - i + 1) });
  }
  for(let d=1; d<=daysInMonth; d++){
    cells.push({ day: d, other: false, date: new Date(year, month, d) });
  }
  while(cells.length % 7 !== 0 || cells.length < 35){
    const idx = cells.length - (startOffset + daysInMonth) + 1;
    cells.push({ day: idx, other: true, date: new Date(year, month+1, idx) });
  }

  const today = new Date();
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  let monthEventCount = 0;

  cells.forEach(cell => {
    const key = dateKey(cell.date);
    const dayEvents = events[key] || [];
    if(!cell.other) monthEventCount += dayEvents.length;

    const div = document.createElement('div');
    div.className = 'day-cell' + (cell.other ? ' other' : '') + (sameDay(cell.date, today) ? ' today' : '') + (selectedDate && sameDay(cell.date, selectedDate) ? ' selected' : '');

    const num = document.createElement('div');
    num.className = 'day-num';
    num.textContent = cell.day;
    div.appendChild(num);

    const dots = document.createElement('div');
    dots.className = 'event-dots';

    dayEvents.slice(0, 2).forEach(ev => {
      const chip = document.createElement('div');
      chip.className = `mini-chip author-${ev.author}`;
      chip.textContent = ev.time ? `${ev.time} ${ev.title}` : ev.title;
      dots.appendChild(chip);
    });

    if(dayEvents.length > 2) {
      const more = document.createElement('div');
      more.style.fontSize = '8.5px';
      more.style.fontWeight = '800';
      more.style.color = 'var(--text-muted)';
      more.textContent = `+${dayEvents.length - 2}`;
      dots.appendChild(more);
    }

    div.appendChild(dots);

    div.addEventListener('click', () => {
      selectedDate = cell.date;
      renderCalendar();
      renderSidebar();
    });

    grid.appendChild(div);
  });

  document.getElementById('totalMonthEvs').textContent = monthEventCount;
  const pct = Math.min(Math.round((monthEventCount / 30) * 100), 100);
  document.getElementById('progressPct').textContent = `${pct}%`;
  document.getElementById('progressFill').style.width = `${pct}%`;
}

function renderSidebar(){
  const key = dateKey(selectedDate);
  const dayEvents = events[key] || [];
  const weekdayNames = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];

  document.getElementById('selDateLabel').textContent = selectedDate.getDate() + ' ' + MONTHS[selectedDate.getMonth()];
  document.getElementById('selDateSub').textContent = weekdayNames[selectedDate.getDay()] + ', ' + selectedDate.getFullYear();
  document.getElementById('addForm').style.display = 'block';

  const list = document.getElementById('eventList');
  list.innerHTML = '';

  if(dayEvents.length === 0){
    list.innerHTML = '<div class="empty-state">Свободный день ☕️</div>';
  } else {
    dayEvents.sort((a,b) => (a.time||'').localeCompare(b.time||''));
    dayEvents.forEach(ev => {
      const card = document.createElement('div');
      card.className = `event-card author-${ev.author}`;

      const catInfo = CATS[ev.category || 'work'];

      card.innerHTML = `
        <div class="event-meta">
          <span class="badge-cat" style="background:${catInfo.color}">${catInfo.label}</span>
          <span class="time-badge">${ev.time || 'Весь день'}</span>
        </div>
        <div class="event-title">${ev.title}</div>
        ${ev.note ? `<div class="event-note">${ev.note}</div>` : ''}
        <div class="event-footer">
          <div class="author-tag">
            ${ev.author === 'B' ? 'Ира' : 'Настя'}
          </div>
          <div class="actions">
            <button onclick="deleteEvent('${key}', '${ev.id}')">Удалить</button>
          </div>
        </div>
      `;
      list.appendChild(card);
    });
  }

  document.getElementById('evTitle').value = '';
  document.getElementById('evTime').value = '';
  document.getElementById('evNote').value = '';
  document.getElementById('addBtn').onclick = () => addEvent(key);
}

function addEvent(key){
  const title = document.getElementById('evTitle').value.trim();
  if(!title){ alert('Введите название!'); return; }

  db.ref('events/' + key).push({
    title: title,
    time: document.getElementById('evTime').value.trim(),
    note: document.getElementById('evNote').value.trim(),
    category: selectedCategory,
    author: currentUser
  });
}

function deleteEvent(key, id){
  db.ref('events/' + key + '/' + id).remove();
}

document.getElementById('prevBtn').addEventListener('click', () => {
  viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()-1, 1);
  renderCalendar();
});
document.getElementById('nextBtn').addEventListener('click', () => {
  viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 1);
  renderCalendar();
});
document.getElementById('todayBtn').addEventListener('click', () => {
  viewDate = new Date();
  renderCalendar();
});
</script>

</body>
</html>
