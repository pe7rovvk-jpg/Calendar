<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Общий календарь</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --navy: #16345e;
    --navy-deep: #0e2340;
    --gold: #c9a15d;
    --gold-soft: #e8d9b8;
    --paper: #f6f7f9;
    --card: #ffffff;
    --line: #dde2ea;
    --text: #1f2430;
    --text-soft: #5b6472;
    --userA: #1b3a6b; /* Настя (синий) */
    --userB: #a04b32; /* Ира (красный) */
    --radius: 6px;
  }

  *{ box-sizing: border-box; }
  body{
    margin:0;
    font-family:'Inter', sans-serif;
    background: var(--paper);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  header.site{
    background: linear-gradient(180deg, var(--navy-deep), var(--navy));
    color: #fff;
    padding: 22px 28px 18px;
    border-bottom: 3px solid var(--gold);
  }
  .crest-row{
    display:flex;
    align-items:center;
    gap:14px;
    max-width: 1080px;
    margin: 0 auto;
  }
  .crest{
    width: 46px; height:46px;
    border: 2px solid var(--gold);
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'PT Serif', serif;
    font-weight:700;
    font-size: 15px;
    color: var(--gold-soft);
    letter-spacing: 0.5px;
    flex-shrink:0;
  }
  .site-title h1{
    font-family:'PT Serif', serif;
    font-weight:700;
    font-size: 22px;
    margin:0;
    letter-spacing: 0.3px;
  }
  .site-title p{
    margin: 3px 0 0;
    font-size: 12.5px;
    color: #c7d3e6;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }

  main{
    max-width: 1080px;
    margin: 0 auto;
    padding: 26px 20px 60px;
    display:grid;
    grid-template-columns: 1fr 340px;
    gap: 22px;
  }
  @media (max-width: 800px){
    main{ grid-template-columns: 1fr; }
  }

  .panel{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }

  .who-bar{
    grid-column: 1 / -1;
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 12px 16px;
    font-size: 13.5px;
    color: var(--text-soft);
  }
  .who-bar strong{ color: var(--text); }
  .who-bar select{
    font-family:'Inter',sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #fff;
    cursor: pointer;
  }
  .dot{
    width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:6px;
  }

  .cal-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  .cal-head h2{
    font-family:'PT Serif', serif;
    font-size: 18px;
    margin:0;
    text-transform: capitalize;
  }
  .cal-nav{ display:flex; gap:6px; }
  .cal-nav button{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    width: 30px; height: 30px;
    cursor:pointer;
    font-size: 14px;
    color: var(--navy);
  }
  .cal-nav button:hover{ background: var(--gold-soft); }

  .weekdays{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    border-bottom: 1px solid var(--line);
    background: var(--paper);
  }
  .weekdays div{
    text-align:center;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-soft);
    padding: 8px 0;
    font-weight: 600;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
  }
  .day{
    min-height: 88px;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 6px;
    cursor:pointer;
    position: relative;
    transition: background 0.12s;
  }
  .day:nth-child(7n){ border-right:none; }
  .day:hover{ background: #fafbfd; }
  .day.other{ color: #c3c9d4; background: #fbfbfc; }
  .day.today .num{
    background: var(--navy);
    color:#fff;
    border-radius: 50%;
  }
  .day.selected{ outline: 2px solid var(--gold); outline-offset: -2px; }
  .num{
    font-size: 12.5px;
    width: 22px; height: 22px;
    display:flex; align-items:center; justify-content:center;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .ev-chip{
    font-size: 11px;
    font-weight: 600;
    margin-top: 3px;
    padding: 2px 6px;
    border-radius: 4px;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: block;
    text-align: center;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .ev-more{
    font-size: 10px;
    color: var(--text-soft);
    margin-top: 3px;
    text-align: center;
    font-weight: 500;
  }

  .side-head{
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--line);
  }
  .side-head h3{
    font-family:'PT Serif', serif;
    font-size: 16px;
    margin:0 0 2px;
  }
  .side-head span{
    font-size: 12px;
    color: var(--text-soft);
  }
  .event-list{
    padding: 10px 14px;
    display:flex;
    flex-direction:column;
    gap: 10px;
    max-height: 360px;
    overflow-y:auto;
  }
  .event-item{
    border: 1px solid var(--line);
    border-left: 4px solid var(--navy);
    border-radius: var(--radius);
    padding: 10px;
    background: var(--paper);
  }
  .event-item .time-tag{
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: var(--navy);
    background: #ebeeef;
    padding: 1px 6px;
    border-radius: 3px;
    margin-bottom: 4px;
  }
  .event-item .t{
    font-size: 13.5px;
    font-weight: 600;
    margin-bottom: 4px;
    color: var(--text);
  }
  .event-item .m{
    font-size: 11.5px;
    color: var(--text-soft);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap: 6px;
    margin-top: 6px;
  }
  .event-item .actions{ display:flex; gap:8px; }
  .event-item .actions button{
    border:none; background:none; cursor:pointer;
    font-size: 11px;
    color: var(--navy);
    text-decoration: underline;
    padding:0;
  }
  .empty-note{
    padding: 20px 16px;
    font-size: 12.5px;
    color: var(--text-soft);
    text-align:center;
  }

  .add-form{
    padding: 12px 16px 16px;
    border-top: 1px solid var(--line);
  }
  .add-form label{
    display:block;
    font-size: 11px;
    color: var(--text-soft);
    margin: 8px 0 3px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    font-weight: 600;
  }
  .add-form input, .add-form textarea{
    width: 100%;
    font-family:'Inter',sans-serif;
    font-size: 13px;
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background:#fff;
  }
  .add-form textarea{ resize: vertical; min-height: 44px; }
  .add-form button.submit{
    margin-top: 12px;
    width: 100%;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 9px;
    font-size: 13px;
    font-weight: 600;
    cursor:pointer;
    letter-spacing: 0.2px;
  }
  .add-form button.submit:hover{ background: var(--navy-deep); }

  footer{
    text-align:center;
    padding: 18px;
    font-size: 11px;
    color: var(--text-soft);
  }

  .loading{
    padding: 40px;
    text-align:center;
    color: var(--text-soft);
    font-size: 13px;
  }
</style>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

</head>
<body>

<header class="site">
  <div class="crest-row">
    <div class="crest">ОК</div>
    <div class="site-title">
      <h1>Общий календарь</h1>
      <p>записи Насти и Иры</p>
    </div>
  </div>
</header>

<main>
  <div class="panel who-bar">
    <span><strong>Кто вы:</strong></span>
    <select id="whoSelect">
      <option value="A">Настя (синий)</option>
      <option value="B">Ира (красный)</option>
    </select>
  </div>

  <div class="panel">
    <div class="cal-head">
      <h2 id="monthLabel">—</h2>
      <div class="cal-nav">
        <button id="prevBtn">‹</button>
        <button id="todayBtn" style="width:auto;padding:0 10px;">Сегодня</button>
        <button id="nextBtn">›</button>
      </div>
    </div>
    <div class="weekdays">
      <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
    </div>
    <div class="grid" id="calGrid">
      <div class="loading">Загрузка базы данных…</div>
    </div>
  </div>

  <div class="panel" id="sidePanel" style="height:fit-content;">
    <div class="side-head">
      <h3 id="selDateLabel">Выберите день</h3>
      <span id="selDateSub">Нажмите на день в календаре, чтобы посмотреть или добавить план</span>
    </div>
    <div class="event-list" id="eventList">
      <div class="empty-note">Нажмите на дату в сетке</div>
    </div>
    <div class="add-form" id="addForm" style="display:none;">
      <label>Время</label>
      <input type="text" id="evTime" placeholder="например, 14:00 или 14:00 - 15:00">
      <label>План / Название</label>
      <input type="text" id="evTitle" placeholder="Что запланировано">
      <label>Заметка / Подробности</label>
      <textarea id="evNote" placeholder="Дополнительные детали…"></textarea>
      <button class="submit" id="addBtn">Добавить запись</button>
    </div>
  </div>
</main>

<footer>Календарь записей</footer>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDFhYdhoxk3dT8ylTmFRa4_3f0FreoNxrU",
  authDomain: "calendar-71517.firebaseapp.com",
  databaseURL: "https://calendar-71517-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "calendar-71517",
  storageBucket: "calendar-71517.firebasestorage.app",
  messagingSenderId: "374541828108",
  appId: "1:374541828108:web:96a470cc33bfa7ebe96e29",
  measurementId: "G-81EQ7N0J5V"
};

// Инициализация Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];

let events = {}; 
let viewDate = new Date();
let selectedDate = null;
let currentUser = localStorage.getItem('calUser') || 'A';

const whoSelect = document.getElementById('whoSelect');
whoSelect.value = currentUser;
whoSelect.addEventListener('change', () => {
  currentUser = whoSelect.value;
  localStorage.setItem('calUser', currentUser);
});

function pad(n){ return n < 10 ? '0'+n : ''+n; }
function dateKey(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }

// Подписка на синхронизацию в реальном времени
db.ref('events').on('value', (snapshot) => {
  const data = snapshot.val();
  events = {};
  if (data) {
    Object.keys(data).forEach(key => {
      events[key] = Object.keys(data[key]).map(id => ({
        id: id,
        ...data[key][id]
      }));
    });
  }
  renderCalendar();
  if(selectedDate) renderSidebar();
});

function renderCalendar(){
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  document.getElementById('monthLabel').textContent = MONTHS[month] + ' ' + year;

  const first = new Date(year, month, 1);
  let startOffset = first.getDay() - 1; 
  if(startOffset < 0) startOffset = 6;

  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();

  const cells = [];
  for(let i=startOffset; i>0; i--){
    cells.push({ day: daysInPrevMonth - i + 1, other: true, date: new Date(year, month-1, daysInPrevMonth - i + 1) });
  }
  for(let d=1; d<=daysInMonth; d++){
    cells.push({ day: d, other: false, date: new Date(year, month, d) });
  }
  while(cells.length % 7 !== 0 || cells.length < 42){
    const idx = cells.length - (startOffset + daysInMonth) + 1;
    cells.push({ day: idx, other: true, date: new Date(year, month+1, idx) });
  }

  const today = new Date();
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  cells.forEach(cell => {
    const key = dateKey(cell.date);
    const dayEvents = events[key] || [];
    const div = document.createElement('div');
    div.className = 'day' + (cell.other ? ' other' : '') + (sameDay(cell.date, today) ? ' today' : '') + (selectedDate && sameDay(cell.date, selectedDate) ? ' selected' : '');

    const num = document.createElement('div');
    num.className = 'num';
    num.textContent = cell.day;
    div.appendChild(num);

    dayEvents.slice(0,3).forEach(ev => {
      const chip = document.createElement('div');
      chip.className = 'ev-chip';
      chip.style.background = ev.author === 'B' ? 'var(--userB)' : 'var(--userA)';
      chip.textContent = ev.time ? ev.time : ev.title;
      chip.title = (ev.time ? ev.time + ' — ' : '') + ev.title;
      div.appendChild(chip);
    });

    if(dayEvents.length > 3){
      const more = document.createElement('div');
      more.className = 'ev-more';
      more.textContent = '+' + (dayEvents.length - 3) + ' ещё';
      div.appendChild(more);
    }

    div.addEventListener('click', () => {
      selectedDate = cell.date;
      renderCalendar();
      renderSidebar();
      if (window.innerWidth <= 800) {
        document.getElementById('sidePanel').scrollIntoView({ behavior: 'smooth' });
      }
    });

    grid.appendChild(div);
  });
}

function renderSidebar(){
  const key = dateKey(selectedDate);
  const dayEvents = events[key] || [];
  const weekdayNames = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];

  document.getElementById('selDateLabel').textContent = selectedDate.getDate() + ' ' + MONTHS[selectedDate.getMonth()];
  document.getElementById('selDateSub').textContent = weekdayNames[selectedDate.getDay()] + ', ' + selectedDate.getFullYear();
  document.getElementById('addForm').style.display = 'block';

  const list = document.getElementById('eventList');
  list.innerHTML = '';

  if(dayEvents.length === 0){
    list.innerHTML = '<div class="empty-note">На этот день планов пока нет</div>';
  } else {
    dayEvents.sort((a,b) => (a.time||'').localeCompare(b.time||''));
    dayEvents.forEach(ev => {
      const item = document.createElement('div');
      item.className = 'event-item';
      item.style.borderLeftColor = ev.author === 'B' ? 'var(--userB)' : 'var(--userA)';

      if(ev.time){
        const timeTag = document.createElement('div');
        timeTag.className = 'time-tag';
        timeTag.textContent = ev.time;
        item.appendChild(timeTag);
      }

      const t = document.createElement('div');
      t.className = 't';
      t.textContent = ev.title;
      item.appendChild(t);

      if(ev.note){
        const n = document.createElement('div');
        n.style.fontSize = '12px';
        n.style.color = 'var(--text-soft)';
        n.style.margin = '4px 0';
        n.textContent = ev.note;
        item.appendChild(n);
      }

      const m = document.createElement('div');
      m.className = 'm';
      const who = document.createElement('span');
      who.innerHTML = '<span class="dot" style="background:' + (ev.author==='B' ? 'var(--userB)' : 'var(--userA)') + '"></span>' + (ev.author === 'B' ? 'Ира' : 'Настя');
      
      const actions = document.createElement('span');
      actions.className = 'actions';
      const editBtn = document.createElement('button');
      editBtn.textContent = 'Изменить';
      editBtn.addEventListener('click', () => startEdit(key, ev));
      const delBtn = document.createElement('button');
      delBtn.textContent = 'Удалить';
      delBtn.addEventListener('click', () => deleteEvent(key, ev.id));
      
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);
      m.appendChild(who);
      m.appendChild(actions);
      item.appendChild(m);

      list.appendChild(item);
    });
  }

  document.getElementById('evTitle').value = '';
  document.getElementById('evTime').value = '';
  document.getElementById('evNote').value = '';
  document.getElementById('addBtn').textContent = 'Добавить план';
  document.getElementById('addBtn').onclick = () => addEvent(key);
}

function addEvent(key){
  const title = document.getElementById('evTitle').value.trim();
  if(!title){ alert('Укажите название плана'); return; }
  const time = document.getElementById('evTime').value.trim();
  const note = document.getElementById('evNote').value.trim();

  const newRef = db.ref('events/' + key).push();
  newRef.set({
    title: title,
    time: time,
    note: note,
    author: currentUser
  });
}

function startEdit(key, ev){
  document.getElementById('evTitle').value = ev.title;
  document.getElementById('evTime').value = ev.time || '';
  document.getElementById('evNote').value = ev.note || '';
  const btn = document.getElementById('addBtn');
  btn.textContent = 'Сохранить изменения';
  btn.onclick = () => {
    const title = document.getElementById('evTitle').value.trim();
    if(!title){ alert('Укажите название плана'); return; }
    
    db.ref('events/' + key + '/' + ev.id).update({
      title: title,
      time: document.getElementById('evTime').value.trim(),
      note: document.getElementById('evNote').value.trim()
    });
  };
  document.getElementById('evTitle').focus();
}

function deleteEvent(key, id){
  db.ref('events/' + key + '/' + id).remove();
}

document.getElementById('prevBtn').addEventListener('click', () => {
  viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()-1, 1);
  renderCalendar();
});
document.getElementById('nextBtn').addEventListener('click', () => {
  viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 1);
  renderCalendar();
});
document.getElementById('todayBtn').addEventListener('click', () => {
  viewDate = new Date();
  renderCalendar();
});
</script>

</body>
</html>
